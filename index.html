<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>桃源鬼島記 Peachling and the Oni Isle</title>
<meta name="description" content="原創的 16 位元風格角色扮演遊戲：從桃子裡生的少年，和狗、猴子、雉雞一起渡海前往鬼之島。中英雙語。An original 16-bit style RPG in Chinese and English: a boy born from a peach crosses the sea to the Oni Isle with a dog, a monkey and a pheasant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="桃源鬼島記">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Cubic11; src: url(fonts/Cubic_11.woff2) format('woff2'); font-display: block; }
  /* the notch and the home bar, read back by fit() below */
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --s: 1; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  /* pinned to the screen so iOS cannot rubber-band or pull-to-refresh the page */
  body { position: fixed; inset: 0; height: 100dvh; box-sizing: border-box; padding: var(--sat) var(--sar) var(--sab) var(--sal); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Cubic11, sans-serif; color: #ccd; }
  #wrap { position: relative; line-height: 0; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #touch { display: none; width: 100%; max-width: calc(560px * var(--s)); height: calc(180px * var(--s)); position: relative; flex: none; }
  body.touching #touch { display: block; }
  /* landscape phones and tablets: the pad sits on both sides of the picture instead of under it */
  body.touching.side #touch { position: fixed; inset: 0; width: auto; max-width: none; height: auto; pointer-events: none; }
  body.side .dpad, body.side .btns { pointer-events: auto; }
  body.side .dpad { left: calc(var(--sal) + 14px); bottom: calc(var(--sab) + 18px); }
  body.side .btns { right: calc(var(--sar) + 8px); bottom: calc(var(--sab) + 12px); }
  .dpad { position: absolute; left: 18px; bottom: 18px; width: 140px; height: 140px; transform: scale(var(--s)); transform-origin: left bottom; }
  .dpad div { position: absolute; width: 46px; height: 46px; background: #2a2f48; border: 2px solid #4a5070; border-radius: 6px; }
  .dpad .u { left: 47px; top: 0; } .dpad .d { left: 47px; bottom: 0; } .dpad .l { left: 0; top: 47px; } .dpad .r { right: 0; top: 47px; } .dpad .c { left: 47px; top: 47px; border-radius: 0; background: #23273c; }
  .btns { position: absolute; right: 0; bottom: 0; width: 190px; height: 150px; transform: scale(var(--s)); transform-origin: right bottom; }
  .btn { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #8a2838; border: 3px solid #c84858; color: #fff; font: 22px Cubic11, sans-serif; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .btn.a { right: 22px; bottom: 70px; }
  .btn.b { right: 100px; bottom: 26px; background: #283878; border-color: #4868c8; }
  .btn.m { right: 22px; bottom: 6px; width: 52px; height: 30px; border-radius: 15px; font-size: 14px; background: #3a3a48; border-color: #6a6a80; }
  #musicBtn { position: fixed; top: calc(var(--sat) + 8px); right: calc(var(--sar) + 8px); z-index: 20; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); background: rgba(20,24,48,0.6); color: #fff; font: 20px sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  #musicBtn.off { opacity: 0.6; }
  #musicBtn.off::after { content: ''; position: absolute; width: 30px; height: 3px; background: #ff6070; transform: rotate(-45deg); border-radius: 2px; }
</style>
</head>
<body>
<button id="musicBtn" type="button" aria-label="Music on/off" title="Music on/off (M)">♪</button>
<div id="wrap"><canvas id="screen" width="256" height="224"></canvas></div>
<div id="touch">
  <div class="dpad"><div class="u" data-k="up"></div><div class="l" data-k="left"></div><div class="c"></div><div class="r" data-k="right"></div><div class="d" data-k="down"></div></div>
  <div class="btns">
    <div class="btn b" data-k="b">B</div>
    <div class="btn a" data-k="a">A</div>
    <div class="btn m" data-k="menu" id="menuBtn">選單</div>
  </div>
</div>
<script>
  // Scale the 256x224 picture by a whole number of real screen pixels, so every game pixel is an
  // even square even with Windows display scaling at 125% or 150%. The canvas itself is that big.
  // With the touch pad, the picture goes above the pad (portrait) or between its two halves
  // (landscape), whichever gives the bigger picture; the notch and the home bar are kept clear.
  function fit() {
    const b = document.body, touch = b.classList.contains('touching');
    const cs = getComputedStyle(document.documentElement), px = (n) => parseFloat(cs.getPropertyValue(n)) || 0;
    const vw = innerWidth, vh = innerHeight;
    const aw0 = vw - px('--sal') - px('--sar'), ah0 = vh - px('--sat') - px('--sab');
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const kOf = (w, h) => Math.max(1, Math.floor(Math.min(w * dpr / 256, h * dpr / 224)));
    let k = kOf(aw0, ah0), side = false, s = 1;
    if (touch) {
      // on a big tablet the pad grows a little, so it is not lost under the thumbs, unless the
      // normal-size pad leaves room for a bigger picture
      const big = Math.max(1, Math.min(1.25, Math.min(vw, vh) / 700));
      k = 0;
      for (const ps of big > 1 ? [big, 1] : [1]) {
        const kb = kOf(aw0, ah0 - 180 * ps), ks = kOf(aw0 - 2 * 200 * ps, ah0);
        const kk = Math.max(kb, ks);
        if (kk > k) { k = kk; s = ps; side = ks > kb || (ks === kb && vw > vh); }
      }
    }
    if (b.classList.contains('side') !== side) b.classList.toggle('side', side);
    document.documentElement.style.setProperty('--s', s.toFixed(3));
    const c = document.getElementById('screen');
    if (c.width !== 256 * k) { c.width = 256 * k; c.height = 224 * k; }
    c.style.width = (256 * k) / dpr + 'px'; c.style.height = (224 * k) / dpr + 'px';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 300));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  fit();
</script>
<script type="module" src="js/main.js?v=7"></script>
</body>
</html>
